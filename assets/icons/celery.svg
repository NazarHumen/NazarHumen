<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="84" height="92" role="img" aria-label="celery">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#5aa469" stop-opacity=".55"/><stop offset=".6" stop-color="#5aa469" stop-opacity=".18"/><stop offset="1" stop-color="#5aa469" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .halo{animation:halo 3s ease-in-out infinite;animation-delay:-2.05s;transform-origin:80px 84px}
    .ring{animation:spin 12s linear infinite;transform-origin:80px 84px}
    .o1{animation:spin 4s linear infinite;animation-delay:-2.05s;transform-origin:80px 84px}
    .o2{animation:spin 7s linear infinite reverse;animation-delay:-2.05s;transform-origin:80px 84px}
    .float{animation:float 3s ease-in-out infinite;animation-delay:-2.05s;transform-origin:80px 84px}
    .shadow{animation:shadow 3s ease-in-out infinite;animation-delay:-2.05s;transform-origin:80px 164px}
    .sp{animation:twinkle 2.4s ease-in-out infinite;transform-origin:0 0}
    .s1{animation-delay:-0.25s}.s2{animation-delay:-1.05s}.s3{animation-delay:-1.85s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes halo{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-12px) rotate(3deg) scale(1.07)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.6);opacity:.1}}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle class="halo" cx="80" cy="84" r="72" fill="url(#halo)"/>
  <circle class="ring" cx="80" cy="84" r="70" fill="none" stroke="#5aa469" stroke-width="1.8" stroke-dasharray="3 9" stroke-linecap="round" opacity=".75"/>
  <g class="o1"><circle cx="80" cy="14" r="8" fill="#5aa469" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#5aa469"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#5aa469" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#5aa469"/></g>
  <ellipse class="shadow" cx="80" cy="164" rx="32" ry="5" fill="#808080"/>
  <g class="float"><g transform="translate(16 20)"><g transform="scale(5.3333)" fill="#37814a"><path d="M2.303 0A2.298 2.298 0 0 0 0 2.303v19.394A2.298 2.298 0 0 0 2.303 24h19.394A2.298 2.298 0 0 0 24 21.697V2.303A2.298 2.298 0 0 0 21.697 0zm8.177 3.072c4.098 0 7.028 1.438 7.68 1.764l-1.194 2.55c-2.442-1.057-4.993-1.41-5.672-1.41-1.574 0-2.17.922-2.17 1.763v8.494c0 .869.596 1.791 2.17 1.791.679 0 3.23-.38 5.672-1.41l1.194 2.496c-.435.271-3.637 1.818-7.68 1.818-1.112 0-4.64-.244-4.64-4.64V7.713c0-4.397 3.528-4.64 4.64-4.64z"/></g></g></g>
  <g transform="translate(22 40)"><path class="sp s1" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#5aa469"/></g>
  <g transform="translate(140 56)"><path class="sp s2" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#5aa469"/></g>
  <g transform="translate(128 140)"><path class="sp s3" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#5aa469"/></g>
</svg>
