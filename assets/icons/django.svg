<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="84" height="92" role="img" aria-label="django">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#44b78b" stop-opacity=".55"/><stop offset=".6" stop-color="#44b78b" stop-opacity=".18"/><stop offset="1" stop-color="#44b78b" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .halo{animation:halo 3s ease-in-out infinite;animation-delay:-0.41s;transform-origin:80px 84px}
    .ring{animation:spin 12s linear infinite;transform-origin:80px 84px}
    .o1{animation:spin 4s linear infinite;animation-delay:-0.41s;transform-origin:80px 84px}
    .o2{animation:spin 7s linear infinite reverse;animation-delay:-0.41s;transform-origin:80px 84px}
    .float{animation:float 3s ease-in-out infinite;animation-delay:-0.41s;transform-origin:80px 84px}
    .shadow{animation:shadow 3s ease-in-out infinite;animation-delay:-0.41s;transform-origin:80px 164px}
    .sp{animation:twinkle 2.4s ease-in-out infinite;transform-origin:0 0}
    .s1{animation-delay:-0.53s}.s2{animation-delay:-1.33s}.s3{animation-delay:-2.13s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes halo{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-12px) rotate(3deg) scale(1.07)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.6);opacity:.1}}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle class="halo" cx="80" cy="84" r="72" fill="url(#halo)"/>
  <circle class="ring" cx="80" cy="84" r="70" fill="none" stroke="#44b78b" stroke-width="1.8" stroke-dasharray="3 9" stroke-linecap="round" opacity=".75"/>
  <g class="o1"><circle cx="80" cy="14" r="8" fill="#44b78b" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#44b78b"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#44b78b" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#44b78b"/></g>
  <ellipse class="shadow" cx="80" cy="164" rx="32" ry="5" fill="#808080"/>
  <g class="float"><g transform="translate(16 20)"><g fill="#44b78b"><path d="M59.448 0h20.93v96.88c-10.737 2.04-18.62 2.855-27.181 2.855-25.551-.001-38.87-11.551-38.87-33.705 0-21.338 14.135-35.2 36.015-35.2 3.398 0 5.98.272 9.106 1.087zm0 48.765c-2.446-.815-4.485-1.086-7.067-1.086-10.6 0-16.717 6.523-16.717 17.939 0 11.145 5.845 17.26 16.582 17.26 2.309 0 4.212-.136 7.202-.542z"/><path d="M113.672 32.321V80.84c0 16.717-1.224 24.735-4.893 31.666-3.398 6.661-7.883 10.873-17.124 15.494l-19.435-9.241c9.242-4.35 13.726-8.153 16.58-14 2.99-5.979 3.943-12.91 3.943-31.122V32.321zM92.742.111h20.93v21.474h-20.93z"/></g></g></g>
  <g transform="translate(22 40)"><path class="sp s1" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#44b78b"/></g>
  <g transform="translate(140 56)"><path class="sp s2" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#44b78b"/></g>
  <g transform="translate(128 140)"><path class="sp s3" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#44b78b"/></g>
</svg>
