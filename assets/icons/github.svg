<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="84" height="92" role="img" aria-label="github">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#8b949e" stop-opacity=".55"/><stop offset=".6" stop-color="#8b949e" stop-opacity=".18"/><stop offset="1" stop-color="#8b949e" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .halo{animation:halo 3s ease-in-out infinite;animation-delay:-0.28s;transform-origin:80px 84px}
    .ring{animation:spin 12s linear infinite;transform-origin:80px 84px}
    .o1{animation:spin 4s linear infinite;animation-delay:-0.28s;transform-origin:80px 84px}
    .o2{animation:spin 7s linear infinite reverse;animation-delay:-0.28s;transform-origin:80px 84px}
    .float{animation:float 3s ease-in-out infinite;animation-delay:-0.28s;transform-origin:80px 84px}
    .flip{animation:flip 6s ease-in-out infinite;animation-delay:-5.84s;transform-origin:80px 84px}
    .shadow{animation:shadow 3s ease-in-out infinite;animation-delay:-0.28s;transform-origin:80px 164px}
    .sp{animation:twinkle 2.4s ease-in-out infinite;transform-origin:0 0}
    .s1{animation-delay:-1.84s}.s2{animation-delay:-2.64s}.s3{animation-delay:-3.44s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes halo{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-12px) rotate(3deg) scale(1.07)}}
    @keyframes flip{0%,62%{transform:scaleX(1)}69%{transform:scaleX(0)}75%{transform:scaleX(-1)}81%{transform:scaleX(0)}88%,100%{transform:scaleX(1)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.6);opacity:.1}}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle class="halo" cx="80" cy="84" r="72" fill="url(#halo)"/>
  <circle class="ring" cx="80" cy="84" r="70" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="3 9" stroke-linecap="round" opacity=".75"/>
  <g class="o1"><circle cx="80" cy="14" r="8" fill="#8b949e" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#8b949e"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#8b949e" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#8b949e"/></g>
  <ellipse class="shadow" cx="80" cy="164" rx="32" ry="5" fill="#808080"/>
