<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="84" height="92" role="img" aria-label="html5">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#e34f26" stop-opacity=".55"/><stop offset=".6" stop-color="#e34f26" stop-opacity=".18"/><stop offset="1" stop-color="#e34f26" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .halo{animation:halo 3s ease-in-out infinite;animation-delay:-1.92s;transform-origin:80px 84px}
    .ring{animation:spin 12s linear infinite;transform-origin:80px 84px}
    .o1{animation:spin 4s linear infinite;animation-delay:-1.92s;transform-origin:80px 84px}
    .o2{animation:spin 7s linear infinite reverse;animation-delay:-1.92s;transform-origin:80px 84px}
    .float{animation:float 3s ease-in-out infinite;animation-delay:-1.92s;transform-origin:80px 84px}
    .flip{animation:flip 6s ease-in-out infinite;animation-delay:-2.76s;transform-origin:80px 84px}
    .shadow{animation:shadow 3s ease-in-out infinite;animation-delay:-1.92s;transform-origin:80px 164px}
    .sp{animation:twinkle 2.4s ease-in-out infinite;transform-origin:0 0}
    .s1{animation-delay:-1.56s}.s2{animation-delay:-2.36s}.s3{animation-delay:-3.16s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes halo{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-12px) rotate(3deg) scale(1.07)}}
    @keyframes flip{0%,62%{transform:scaleX(1)}69%{transform:scaleX(0)}75%{transform:scaleX(-1)}81%{transform:scaleX(0)}88%,100%{transform:scaleX(1)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.6);opacity:.1}}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle class="halo" cx="80" cy="84" r="72" fill="url(#halo)"/>
  <circle class="ring" cx="80" cy="84" r="70" fill="none" stroke="#e34f26" stroke-width="1.8" stroke-dasharray="3 9" stroke-linecap="round" opacity=".75"/>
  <g class="o1"><circle cx="80" cy="14" r="8" fill="#e34f26" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#e34f26"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#e34f26" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#e34f26"/></g>
  <ellipse class="shadow" cx="80" cy="164" rx="32" ry="5" fill="#808080"/>
  <g class="float"><g class="flip"><g transform="translate(16 20)"><g><path fill="#E44D26" d="M19.037 113.876L9.032 1.661h109.936l-10.016 112.198-45.019 12.48z"/><path fill="#F16529" d="M64 116.8l36.378-10.086 8.559-95.878H64z"/><path fill="#EBEBEB" d="M64 52.455H45.788L44.53 38.361H64V24.599H29.489l.33 3.692 3.382 37.927H64zm0 35.743l-.061.017-15.327-4.14-.979-10.975H33.816l1.928 21.609 28.193 7.826.063-.017z"/><path fill="#fff" d="M63.952 52.455v13.763h16.947l-1.597 17.849-15.35 4.143v14.319l28.215-7.82.207-2.325 3.234-36.233.335-3.696h-3.708zm0-27.856v13.762h33.244l.276-3.092.628-6.978.329-3.692z"/></g></g></g></g>
  <g transform="translate(22 40)"><path class="sp s1" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#e34f26"/></g>
  <g transform="translate(140 56)"><path class="sp s2" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#e34f26"/></g>
  <g transform="translate(128 140)"><path class="sp s3" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#e34f26"/></g>
</svg>
