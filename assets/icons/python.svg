  <g class="o1"><circle cx="80" cy="14" r="8" fill="#ffd43b" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#ffd43b"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#ffd43b" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#ffd43b"/></g>
  <ellipse class="shadow" cx="80" cy="164" rx="32" ry="5" fill="#808080"/>
