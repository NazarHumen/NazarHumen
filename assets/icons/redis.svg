  <g class="o1"><circle cx="80" cy="14" r="8" fill="#dc382d" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#dc382d"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#dc382d" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#dc382d"/></g>
