<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 176" width="84" height="92" role="img" aria-label="vuejs">
  <defs>
    <radialGradient id="halo"><stop offset="0" stop-color="#42b883" stop-opacity=".55"/><stop offset=".6" stop-color="#42b883" stop-opacity=".18"/><stop offset="1" stop-color="#42b883" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .halo{animation:halo 3s ease-in-out infinite;animation-delay:-1.10s;transform-origin:80px 84px}
    .ring{animation:spin 12s linear infinite;transform-origin:80px 84px}
    .o1{animation:spin 4s linear infinite;animation-delay:-1.10s;transform-origin:80px 84px}
    .o2{animation:spin 7s linear infinite reverse;animation-delay:-1.10s;transform-origin:80px 84px}
    .float{animation:float 3s ease-in-out infinite;animation-delay:-1.10s;transform-origin:80px 84px}
    .flip{animation:flip 6s ease-in-out infinite;animation-delay:-1.30s;transform-origin:80px 84px}
    .shadow{animation:shadow 3s ease-in-out infinite;animation-delay:-1.10s;transform-origin:80px 164px}
    .sp{animation:twinkle 2.4s ease-in-out infinite;transform-origin:0 0}
    .s1{animation-delay:-0.50s}.s2{animation-delay:-1.30s}.s3{animation-delay:-2.10s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes halo{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.12);opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-12px) rotate(3deg) scale(1.07)}}
    @keyframes flip{0%,62%{transform:scaleX(1)}69%{transform:scaleX(0)}75%{transform:scaleX(-1)}81%{transform:scaleX(0)}88%,100%{transform:scaleX(1)}}
    @keyframes shadow{0%,100%{transform:scaleX(1);opacity:.28}50%{transform:scaleX(.6);opacity:.1}}
    @keyframes twinkle{0%,100%{transform:scale(0) rotate(0deg);opacity:0}50%{transform:scale(1.1) rotate(90deg);opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle class="halo" cx="80" cy="84" r="72" fill="url(#halo)"/>
  <circle class="ring" cx="80" cy="84" r="70" fill="none" stroke="#42b883" stroke-width="1.8" stroke-dasharray="3 9" stroke-linecap="round" opacity=".75"/>
  <g class="o1"><circle cx="80" cy="14" r="8" fill="#42b883" opacity=".25"/><circle cx="80" cy="14" r="3.6" fill="#42b883"/></g>
  <g class="o2"><circle cx="80" cy="30" r="5" fill="#42b883" opacity=".22"/><circle cx="80" cy="30" r="2.3" fill="#42b883"/></g>
  <ellipse class="shadow" cx="80" cy="164" rx="32" ry="5" fill="#808080"/>
  <g class="float"><g class="flip"><g transform="translate(16 20)"><g><path d="M0 8.934l49.854.158 14.167 24.47 14.432-24.47L128 8.935l-63.834 110.14zm126.98.637l-24.36.02-38.476 66.053L25.691 9.592.942 9.572l63.211 107.89zm-25.149-.008l-22.745.168-15.053 24.647L49.216 9.73l-22.794-.168 37.731 64.476zm-75.834-.17l23.002.009m-23.002-.01l23.002.01" fill="none"/><path d="M25.997 9.393l23.002.009L64.035 34.36 79.018 9.404 102 9.398 64.15 75.053z" fill="#35495e"/><path d="M.91 9.569l25.067-.172 38.15 65.659L101.98 9.401l25.11.026-62.966 108.06z" fill="#41b883"/></g></g></g></g>
  <g transform="translate(22 40)"><path class="sp s1" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#42b883"/></g>
  <g transform="translate(140 56)"><path class="sp s2" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#42b883"/></g>
  <g transform="translate(128 140)"><path class="sp s3" d="M0,-7 L1.8,-1.8 L7,0 L1.8,1.8 L0,7 L-1.8,1.8 L-7,0 L-1.8,-1.8Z" fill="#42b883"/></g>
</svg>
